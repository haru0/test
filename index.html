<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生涯スポーツ実習 問題アプリ</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f4f7fb;color:#223}main{text-align:center;padding:24px}.loader{width:44px;height:44px;border:5px solid #dbe3ee;border-top-color:#2563eb;border-radius:50%;margin:0 auto 16px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><main><div class="loader"></div><p>問題アプリを読み込んでいます…</p></main><script src="p1.js"></script><script>(async()=>{try{const b64=(window.APP_PARTS||[]).join('');const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<main><h1>読み込みに失敗しました</h1><p>Safari・Chromeなどの新しいブラウザで開いてください。</p></main>';console.error(e)}})();</script></body></html>
